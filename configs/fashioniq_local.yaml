seed: 42

dataset:
  name: fashioniq
  root: .
  categories: [dress, shirt, toptee]
  caption_mode: concat
  image_size: 224
  resize_size: 256
  num_workers: 0
  train_split: train
  val_split: val

model:
  embedding_dim: 768
  image_encoder:
    type: swin
    name: swin_base_patch4_window7_224.ms_in22k_ft_in1k
    pretrained: false
    out_indices: [2, 3]
    pool_size: 7
    freeze: false
  text_encoder:
    type: distilbert
    name: distilbert-base-uncased
    max_length: 128
    freeze: false
  composition:
    num_blocks: 3
    num_heads: 8
    ffn_multiplier: 4
    dropout: 0.1

loss:
  temperature: 0.07
  symmetric: true
  label_smoothing: 0.1

optimizer:
  name: adamw
  image_lr: 1.0e-5
  text_lr: 1.0e-5
  composition_lr: 3.0e-4
  weight_decay: 0.01

scheduler:
  name: cosine
  eta_min: 1.0e-6

training:
  epochs: 60
  batch_size: 16
  grad_accumulation: 1
  amp: true
  clip_grad_norm: 1.0
  eval_every: 5
  output_dir: outputs/fashioniq_improved

evaluation:
  batch_size: 8
  recall_ks: [10, 50]
  exclude_query: true
