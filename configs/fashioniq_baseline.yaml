seed: 42

dataset:
  name: fashioniq
  root: data/fashioniq
  categories: [dress, shirt, toptee]
  caption_mode: random
  image_size: 224
  resize_size: 256
  num_workers: 4
  train_split: train
  val_split: val

model:
  embedding_dim: 768
  image_encoder:
    type: swin
    name: swin_base_patch4_window7_224.ms_in22k_ft_in1k
    pretrained: true
    out_indices: [2, 3]
    pool_size: 7
    freeze: false
  text_encoder:
    type: distilbert
    name: distilbert-base-uncased
    max_length: 128
    freeze: false
  composition:
    num_blocks: 3
    num_heads: 8
    ffn_multiplier: 4
    dropout: 0.0

loss:
  temperature: 1.0
  symmetric: false
  label_smoothing: 0.0

optimizer:
  name: sgd
  lr: 0.035
  momentum: 0.9
  weight_decay: 1.0e-4

scheduler:
  name: step
  step_size: 10
  gamma: 0.1

training:
  epochs: 60
  batch_size: 32
  grad_accumulation: 1
  amp: true
  clip_grad_norm: 1.0
  eval_every: 5
  output_dir: outputs/fashioniq_baseline

evaluation:
  batch_size: 64
  recall_ks: [10, 50]
  exclude_query: true
